[ ] file paths
    . ABSOLUTE file paths
        /home/doug/Webdev_Ubuntu/folder/another-folder/index.html
        ⮝⮝⮝ This is an ABSOLUTE path. It starts with a slash and describes the ENTIRE path from the root of the server's hard drive.
        We generally don't need to use these in HTML.
    . RELATIVE file paths
        ../../images/icons/home.svg
        ⮝⮝⮝ This is a RELATIVE file path. It gives directions from the CURRENT document to another one.
        ./ means "current folder"
        ../ means "previous folder"

[ ] Block vs inline
    - When it comes to their WIDTH...
        . BLOCK ELEMENTS want to be 100% the width of their parent element
        . INLINE ELEMENTS only take up the width they need
    - Do they like to share the line with other elements?
        . BLOCK ELEMENTS do NOT 🗙
        . INLINE ELEMENTS DO ✔
    - Can they be resized?
        . BLOCK ELEMENTS are easy to resize
        . Some INLINE elements cannot have their HEIGHT resized, and padding/margin behave differently
